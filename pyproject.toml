[project]
name = "projeto-aula"
version = "0.1.0"
description = "Projeto realizado na aula de Trilha Python"
authors = [
    {name = "Lucas Vieira Felisberto",email = "106781231+lucasvieirafelisberto@users.noreply.github.com."}
]
readme = "README.md"
requires-python = ">=3.13, <4.0"
dependencies = [
    "requests (>=2.34.2,<3.0.0)"
]

[tool.poetry]
packages = [{include = "projeto_aula", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
projeto_aula = "projeto_aula.main:main"

[dependency-groups]
dev = [
    "ruff (>=0.16.10,<0.17.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.taskipy.tasks]
lint = "ruff check --select I . && ruff format . --check"
format = "ruff format . && ruff check --select I --fix ."
test = "pytest ./tests/ -v && pytest --cov=src/projeto_aula"